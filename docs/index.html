<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PetIngle</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff8f2;
        color: #3d2a20;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(620px, 100%);
        padding: 40px 32px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #f1dfd2;
        border-radius: 24px;
        box-shadow: 0 16px 48px rgba(96, 55, 27, 0.08);
      }
      h1 { margin: 0 0 12px; color: #e86f24; }
      p { margin: 0; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>PetIngle</h1>
      <p>Organize os cuidados, lembretes e registros dos seus pets em um só lugar.</p>
    </main>
  </body>
</html>
